name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a25d99f65b9f7f88846dd6a4d792f6cb
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: wrangler 4 refuses to run on anything older. Astro is happy
      # on both. Keep this in step with .nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Wrangler comes from devDependencies now, so CI deploys with the same
      # pinned version used locally. `npm install -g wrangler` pulled whatever
      # was latest that morning, which is a bad thing to discover mid-deploy.
      - name: Create Pages project (if not exists)
        run: npx wrangler pages project create ukiptvbox --production-branch main || true

      # Uploads dist/ as static assets and bundles ./functions alongside it,
      # which is what serves /api/order. Run from the repo root or the
      # functions directory is not picked up.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name ukiptvbox --branch main
